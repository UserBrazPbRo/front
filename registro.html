<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário Administrador</title>
    <link rel="stylesheet" href="registro.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Usuário Fala Cooperado!
        </h1>
        
        <form id="adminUserForm" action="/cadastrar-usuario" method="POST">
            <!-- Dados Pessoais -->
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <div class="campo">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                
                <div class="campo">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone">
                </div>
                
                <div class="campo">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" name="cpf" required>
                </div>
            </fieldset>
            
            <!-- Dados de Acesso -->
            <fieldset>
                <legend>Dados de Acesso</legend>
                
                <div class="campo">
                    <label for="username">Nome de Usuário *</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="campo">
                    <label for="password">Senha *</label>
                    <input type="password" id="password" name="password" required minlength="8">
                    <div class="password-strength">Mínimo de 8 caracteres, incluindo letras maiúsculas, minúsculas, números e caracteres especiais.</div>
                </div>
                
                <div class="campo">
                    <label for="confirm_password">Confirmar Senha *</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
            </fieldset>
            
            <!-- Permissões de Administrador -->
            <fieldset>
                <legend>Permissões de Administrador</legend>
                
                <div class="campo">
                    <label for="nivel_acesso">Nível de Acesso *</label>
                    <select id="nivel_acesso" name="nivel_acesso" required>
                        <option value="">Selecione...</option>
                        <option value="superadmin">CONSAD</option>
                        <option value="superadmin">Governança</option>
                        <option value="admin">Delegada/o</option>
                    </select>
                </div>
                
            </fieldset>
            
            <!-- Configurações Adicionais -->
            <fieldset>
                <legend>Configurações Adicionais</legend>
                
                <div class="campo">
                    <label for="data_expiracao">Data de Expiração da Conta</label>
                    <input type="date" id="data_expiracao" name="data_expiracao">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="alterar_senha_prox_login" name="alterar_senha_prox_login">
                    <label for="alterar_senha_prox_login">Forçar alteração de senha no próximo login</label>
                </div>
            </fieldset>
            
            <div class="form-actions">
                <button type="submit">Cadastrar Usuário</button>
            </div>
        </form>
    </div>
</body>
</html>
