<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulario.css">
    <script src="formulario.js" defer></script>
    <title>Feedback Direto</title>
</head>
<body>
    <main class="container">
        <header><h1>Fala Cooperado!</h1></header>
        
        <form id="feedbackForm" action="#" method="post">
                <!-- Selecionar a agência -->
                <section>
                    <h2>Selecione sua agência:</h2>
                    <label for="p1"></label>
                    <select name="agencia" id="p1" required>
                        <option value="02">PA 02 - Alta Floresta D'Oeste - RO</option> 
                        <option value="06">PA 06 - Alto Alegre dos Parecis - RO</option>
                        <option value="12">PA 12 - Alvorada D'Oeste - RO</option>
                        <option value="39">PA 39 - Apiacás - MT</option>
                        <option value="25">PA 25 - Apuí - AM</option>
                        <option value="36">PA 36 - Aripuanã - MT</option>
                        <option value="45">PA 45 - Brianorte - MT</option>
                        <option value="47">PA 47 - Cacoal - Vista Alegre - RO</option>
                        <option value="14">PA 14 - Cacoal - Centro - RO</option>
                        <option value="30">PA 30 - Cacoal - Shopping - RO</option>
                        <option value="41">PA 41 - Cacoal - Teixeirão - RO</option>
                        <option value="27">PA 27 - Cacoal - Cacoal Novo - RO</option>
                        <option value="26">PA 26 - Castanheiras - RO</option>
                        <option value="07">PA 07 - Chupinguaia - RO</option>
                        <option value="28">PA 28 - Colniza - MT</option>
                        <option value="29">PA 29 - Conselvan - MT</option>
                        <option value="21">PA 21 - Costa Marques - RO</option>
                        <option value="33">PA 33 - Cotriguaçu - MT</option>
                        <option value="97">PA 97 - Digital</option>
                        <option value="04">PA 04 - Espigão D'Oeste - RO</option>
                        <option value="40">PA 40 - Guariba - MT</option>
                        <option value="31">PA 31 - Juara - MT</option>
                        <option value="32">PA 32 - Juaruena - MT</option>
                        <option value="19">PA 19 - Ministro Andreazza - RO</option>
                        <option value="24">PA 24 - Matupi - AM</option>
                        <option value="17">PA 17 - Migrantinópolis - RO</option>
                        <option value="35">PA 35 - Nova Bandeirantes - MT</option>
                        <option value="15">PA 15 - Nova Brasilândia D'Oeste - RO</option>
                        <option value="46">PA 46 - Nova Maringá - MT</option>
                        <option value="38">PA 38 - Nova Monte Verde - MT</option>
                        <option value="37">PA 37 - Nova União - MT</option>
                        <option value="44">PA 44 - Novo Horizonte do Norte - RO</option>
                        <option value="18">PA 18 - Novo Horizonte D'Oeste - RO</option>
                        <option value="22">PA 22 - Novo Plano - RO</option>
                        <option value="08">PA 08 - Parecis - RO</option>
                        <option value="23">PA 23 - Pimenta Bueno - Seringal - RO</option>
                        <option value="01">PA 01 - Pimenta Bueno - Centro - RO</option>
                        <option value="43">PA 43 - Porto dos Gaúchos - MT</option>
                        <option value="20">PA 20 - Primavera D'Oeste - RO</option>
                        <option value="09">PA 09 - Rolim de Moura - RO</option>
                        <option value="34">PA 34 - Rondolândia - MT</option>
                        <option value="13">PA 13 - Santa Luzia D'Oeste - RO</option>
                        <option value="16">PA 16 - São Domingos do Guaporé - RO</option>
                        <option value="03">PA 03 - São Felipe D'Oeste - RO</option>
                        <option value="10">PA 10 - São Francisco do Guaporé - RO</option>
                        <option value="11">PA 11 - São Miguel do Guaporé - RO</option>
                        <option value="05">PA 05 - Seringueiras - RO</option>
                        <option value="42">PA 42 - Tabaporã - MT</option>

                    </select>
                </section>
    
                <!-- Categoria do problema -->
                <section>
                    <h2>Selecione a razão do seu feedback:</h2>
                    <label for="p2"></label>
                    <select name="categoria" id="p2" required>
                        <option value="" disabled selected>Selecione a Categoria</option>
                        <optgroup label="Atendimento"></option>
                        <option value="1.1"> - Qualidade no atendimento </option>
                        <option value="1.2"> - Disponibilidade de informações </option>
                        <option value="1.3"> - Produtos e Serviços </option>
                        <optgroup label=" Estrutura"></option>
                        <option value="2.1"> - Acessibilidade </option>
                        <option value="2.2"> - Estrutura da Agência </option>
                        <optgroup label="Problemas Técnicos"> </option>
                        <option value="4.1"> - Sistema fora do ar com frequência </option>
                        <option value="4.2"> - Caixa Eletrônico </option>
                        <option value="4.3"> - Internet </option>
                        <option value="4.4"> - Diversos </option>
                        <optgroup label="Sugestões"></option>
                        <option value="5.1">Sugestões de Melhoria</option>
                        <option value="5.2">Outros</option>
                    </select>
                </section>
                  <!-- Reclamação -->
                <section>
                    <h2>Informe seu feedback:</h2>
                    <label for="p3"></label>
                    <textarea id="p3" name="reclamação" placeholder="Digite sua sugestão, reclamação ou crítica..." rows="5" required></textarea>
                </section>
                <!--Dados-->
                <section>
                    <h2>Caso queira receber notificações do status da sua demanda, preencha os campos abaixo.</h2>
                    <div class="campo">
                        <h2>E-mail:</h2>
                        <label for="email"></label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com">
                        <span id="emailError" class="error-message"></span>
                    </div>
                    
                    <div class="campo">
                        <h2>CPF:</h2>
                        <label for="cpf"></label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14">
                        <span id="cpfError" class="error-message"></span>
                    </div>
                </section>
                
                <!-- Termos de uso-->
                <section>
                    <div class="termos-uso">
                        <input type="checkbox" id="termos" name="termos" required>
                        <label for="termos"><h3>Eu li e concordo com os <a href="https://www.sicoob.com.br/documents/20128/33422236/Termos+de+Uso+-+Novo+Sicoobnet.pdf" target="_blank">termos de uso</h3></a></label>
                        <span id="termosError" class="error-message"></span>
                    </div>
                </section>
                
                <!-- Botão de Envio -->
                <section>
                    <section>
                        <a href="/submit" onclick="alert('Seu feedback foi registrado com sucesso!'); return true;" 
                           class="btn-submit"><button type="submit">Enviar</button></a>
                </section>
            </form>
            </main>
            </body>
            </html>
