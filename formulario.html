<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulario.css">
    <script src="formulario.js" defer></script>
    <title>Feedback Direto</title>
</head>
<body>
    <main class="container">
        <header><h1>Feedback Direto</h1></header>
        
        <form id="feedbackForm" action="#" method="post">
                <!-- Selecionar a agência -->

                        <option value="	45	">	45	Brianorte -	MT	</option>
                        <option value="	47	">	47	Cacoal - Vista Alegre	-	RO	</option>
                        <option value="	14	">	14	Cacoal - Centro	-	RO	</option>
                        <option value="	30	">	30	Cacoal - Shopping	-	RO	</option>
                        <option value="	41	">	41	Cacoal - Teixeirão	-	RO	</option>
                        <option value="	27	">	27	Cacoal - Cacoal Novo	-	RO	</option>
                        <option value="	26	">	26	Castanheiras	-	RO	</option>
                        <option value="	7	">	7	Chupinguaia	-	RO	</option>
                        <option value="	28	">	28	Colniza	-	MT	</option>
                        <option value="	29	">	29	Conselvan	-	MT	</option>
                        <option value="	21	">	21	Costa Marques	-	RO	</option>
                        <option value="	33	">	33	Cotriguaçu	-	MT	</option>
                        <option value="	97	">	97	Digital		</option>
                        <option value="	4	">	4	Espigão D'Oeste	-	RO	</option>
                        <option value="	40	">	40	Guariba	-	MT	</option>
                        <option value="	31	">	31	Juara	-	MT	</option>
                        <option value="	32	">	32	Juaruena	-	MT	</option>
                        <option value="	19	">	19	Ministro Andreazza	-	RO	</option>
                        <option value="	24	">	24	Matupi	-	AM	</option>
                        <option value="	17	">	17	Migrantinópolis	-	RO	</option>
                        <option value="	35	">	35	Nova Bandeirantes	-	MT	</option>
                        <option value="	15	">	15	Nova Brasilândia D'Oeste	-	RO	</option>
                        <option value="	46	">	46	Nova Maringá	-	MT	</option>
                        <option value="	38	">	38	Nova Monte Verde	-	MT	</option>
                        <option value="	37	">	37	Nova União	-	MT	</option>
                        <option value="	44	">	44	Novo Horizonte do Norte	-	RO	</option>
                        <option value="	18	">	18	Novo Horizonte D'Oeste	-	RO	</option>
                        <option value="	22	">	22	Novo Plano	-	RO	</option>
                        <option value="	8	">	8	Parecis	-	RO	</option>
                        <option value="	23	">	23	Pimenta Bueno - Seringal	-	RO	</option>
                        <option value="	1	">	1	Pimenta Bueno - Centro	-	RO	</option>
                        <option value="	43	">	43	Porto dos Gaúchos	-	MT	</option>
                        <option value="	20	">	20	Primavera D'Oeste	-	RO	</option>
                        <option value="	9	">	9	Rolim de Moura	-	RO	</option>
                        <option value="	34	">	34	Rondolândia	-	MT	</option>
                        <option value="	13	">	13	Santa Luzia D'Oeste	-	RO	</option>
                        <option value="	16	">	16	São Domingos do Guaporé	-	RO	</option>
                        <option value="	3	">	3	São Felipe D'Oeste	-	RO	</option>
                        <option value="	10	">	10	São Francisco do Guaporé	-	RO	</option>
                        <option value="	11	">	11	São Miguel do Guaporé	-	RO	</option>
                        <option value="	5	">	5	Seringueiras	-	RO	</option>
                        <option value="	42	">	42	Tabaporã	-	MT	</option>
                    </select>
                </section>
    
                <!-- Categoria do problema -->
                <section>
                    <h2>Selecione a razão do seu feedback:</h2>
                    <label for="p2"></label>
                    <select name="categoria" id="p2" required>
                        <option value="" disabled selected>Selecione a Categoria</option>
                        <optgroup label="Atendimento"></option>
                        <option value="1.1"> - Demora no atendimento </option>
                        <option value="1.2"> - Falta de caixas disponíveis </option>
                        <option value="1.3"> - Atendimento pouco cordial/falta de educação </option>
                        <option value="1.4"> - Dificuldade para falar com gerente </option>
                        <option value="1.5"> - Falta de acessibilidade para PCDs </option>
                        <optgroup label=" Serviços"></option>
                        <option value="2.1"> - Problemas com abertura de contas </option>
                        <option value="2.2"> - Dificuldade para resolver problemas simples </option>
                        <option value="2.3"> - Falta de equipamentos (como terminais de autoatendimento) </option>
                        <option value="2.4"> - Limitação de horário de funcionamento </option>
                        <option value="2.5"> - Cobrança indevida de taxas </option>
                        <optgroup label="Infraestrutura"></option>
                        <option value="3.1"> - Falta de higiene/limpeza </option>
                        <option value="3.2"> - Má conservação do espaço </option>
                        <option value="3.3"> - Falta de privacidade no atendimento </option>
                        <option value="3.4"> - Poucas cadeiras para espera </option>
                        <option value="3.5"> - Problemas com ar-condicionado/ventilação </option>
                        <optgroup label="Problemas Técnicos"> </option>
                        <option value="4.1"> - Sistema fora do ar com frequência </option>
                        <option value="4.2"> - Depósitos não creditados </option>
                        <option value="4.3"> - Transferências não realizadas </option>
                        <option value="4.4"> - Extratos com divergências </option>
                        <option value="4.4"> - Pagamentos duplicados </option>
                        <optgroup label="Sugestões"></option>
                        <option value="5.1">Sugestões de Melhoria</option>
                        <option value="6">Outros</option>
                    </select>
                </section>
                  <!-- Reclamação -->
                <section>
                    <h2>Informe seu feedback:</h2>
                    <label for="p3"></label>
                    <textarea id="p3" name="reclamação" placeholder="Digite sua sugestão, reclamação ou crítica..." rows="5" required></textarea>
                </section>
                <!--Dados-->
                <section>
                    <h2>Caso queira se identificar para receber um e-mail</h2>
                    <div class="campo">
                        <h2>E-mail:</h2>
                        <label for="email"></label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com">
                        <span id="emailError" class="error-message"></span>
                    </div>
                    
                    <div class="campo">
                        <h2>CPF:</h2>
                        <label for="cpf"></label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14">
                        <span id="cpfError" class="error-message"></span>
                    </div>
                </section>
                
                <!-- Termos de uso-->
                <section>
                    <div class="termos-uso">
                        <input type="checkbox" id="termos" name="termos" required>
                        <label for="termos"><h3>Eu li e concordo com os <a href="https://www.sicoob.com.br/documents/20128/33422236/Termos+de+Uso+-+Novo+Sicoobnet.pdf" target="_blank">termos de uso</h3></a></label>
                        <span id="termosError" class="error-message"></span>
                    </div>
                </section>
                
                <!-- Botão de Envio -->
                <section>
                    <section>
                        <a href="/submit" onclick="alert('Seu feedback foi registrado com sucesso!'); return true;" 
                           class="btn-submit"><button type="submit">Enviar</button></a>
                </section>
            </form>
            </main>
            </body>
            </html>
